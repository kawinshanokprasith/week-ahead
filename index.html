<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src https://api.github.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Week Ahead</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7fbdf5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one sticky app bar (brand, Week/Month, work/life filter, week navigation, Add task) above one board:
   the week view (loose tray + 7 day columns) or the month view (5-week grid). Owloo tokens, light and dark. */
@font-face{font-family:Kondolar;src:url(fonts/kondolar-black.otf);font-weight:900}
:root{--bg:#faf9f5;--card:#fff;--sunken:#f3f2ec;--hover:#eceae2;--border:#e7e5dd;--bstrong:#cfccc1;--edge:#8a877d;--ink:#292929;--ink2:#6b6a63;--ink3:#6b6a63;--az:#7fbdf5;--azsoft:#e4eef5;--aztext:#415262;--azhover:#6eb2f0;--rest:#a9a79e;--onink:#fcfcf8;--wk-wash:#eceef1;--wk-chip:#4b5563;--wk-title:#2d3440;--wk-line:#d3d8df;--wk-on:#fff;--lf-wash:#fdebe3;--lf-chip:#a8431c;--lf-title:#7f2f0e;--lf-line:#f0c9b6;--lf-on:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1b19;--card:#232320;--sunken:#2a2a27;--hover:#33332f;--border:#34342f;--bstrong:#4a4a44;--edge:#7a786f;--ink:#f1f0ea;--ink2:#a9a79e;--ink3:#a09e95;--azsoft:#313f49;--aztext:#bfdefa;--azhover:#92c9f8;--rest:#6b6a63;--onink:#1b1b19;--wk-wash:#262b33;--wk-chip:#9aa6b8;--wk-title:#cfd6e2;--wk-line:#3a4250;--wk-on:#1b1b19;--lf-wash:#3a2820;--lf-chip:#e8895f;--lf-title:#f6c9b3;--lf-line:#5a3c2e;--lf-on:#1b1b19}}
:root[data-theme=dark]{--bg:#1b1b19;--card:#232320;--sunken:#2a2a27;--hover:#33332f;--border:#34342f;--bstrong:#4a4a44;--edge:#7a786f;--ink:#f1f0ea;--ink2:#a9a79e;--ink3:#a09e95;--azsoft:#313f49;--aztext:#bfdefa;--azhover:#92c9f8;--rest:#6b6a63;--onink:#1b1b19;--wk-wash:#262b33;--wk-chip:#9aa6b8;--wk-title:#cfd6e2;--wk-line:#3a4250;--wk-on:#1b1b19;--lf-wash:#3a2820;--lf-chip:#e8895f;--lf-title:#f6c9b3;--lf-line:#5a3c2e;--lf-on:#1b1b19}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 2px var(--az)}
h1,h2,h3,p{margin:0}
.bar{position:sticky;top:0;z-index:5;background:var(--sunken);border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:12px max(16px,2.5vw)}
.logo{display:flex;align-items:center;gap:12px;margin-right:4px}
.logo img{width:48px;height:48px;display:block;flex:none}
.brand{font:900 38px/1 Kondolar,Georgia,serif;white-space:nowrap}
.seg{display:inline-flex;gap:4px;background:var(--hover);border:1px solid var(--edge);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 16px;font-weight:500;color:var(--ink2)}
.seg button[aria-pressed=true],.seg button[aria-checked=true]{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--border)}
.pill{border:1px solid var(--edge);background:transparent;border-radius:999px;padding:5px 14px;font-weight:500;color:var(--ink2)}
.pill:hover{background:var(--hover)}
.pill[aria-pressed=true]{border:2px solid var(--ink);color:var(--ink);padding:4px 13px}
.nav{display:flex;align-items:center;gap:8px;margin-left:auto}
.nav .range{font-weight:600;min-width:132px;text-align:center}
.chip{font-size:13px;font-weight:500;background:var(--azsoft);color:var(--aztext);border-radius:999px;padding:2px 10px;white-space:nowrap}
.btn{border:1px solid var(--edge);background:var(--card);border-radius:999px;padding:6px 16px;font-weight:500}
.btn:hover{background:var(--hover)}
.btn.main{background:var(--az);border-color:var(--edge);color:#292929}
.btn.main:hover{background:var(--azhover)}
.btn.sq{width:34px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.saved{font-size:12px;color:var(--ink3);min-width:52px}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:16px max(16px,2.5vw) 0;padding:10px 16px;background:var(--sunken);border-radius:12px;color:var(--ink2);font-size:14px}
.banner button{border:0;background:none;text-decoration:underline;padding:0;font-weight:500;color:var(--ink)}
main{padding:16px max(16px,2.5vw) 48px;overflow-x:auto}
.board{min-width:980px}
.tray{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;border:2px dashed var(--edge);border-radius:14px;padding:10px 14px;margin-bottom:14px;min-height:56px}
.tray.over,.col.over{background:var(--azsoft)}
.tray h2{font-size:14px;font-weight:600;color:var(--aztext)}
.tray .empty{color:var(--ink3);font-size:14px}
.tray .card{width:auto;min-height:0;padding:6px 36px 6px 12px;border-radius:999px}
.tray .card{flex-direction:row;align-items:center;gap:4px 10px}
.tray .card .cm{flex-wrap:nowrap;gap:6px}.tray .card .cm .tag,.tray .card .cm .lk{display:none}
.tray .card .sz{color:var(--ink2);white-space:nowrap}
.tray .card.s-half,.tray .card.s-full{min-height:0}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:start}
.col{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:360px}
.col.wk{background:var(--sunken)}
.col.today{border:2px solid var(--ink);padding:11px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:6px}
.ch h3{font-size:15px;font-weight:600}
.ch .tdy{font-size:11px;font-weight:600;background:var(--sunken);border-radius:999px;padding:1px 8px;margin-left:6px;color:var(--ink2)}
.col.wk .tdy{background:var(--card)}
/* where I work: Office / Work from home / Client site tag (neutral hairline, never Work/Life colors) */
.whr{min-height:26px;display:flex;align-items:center}
.wtag{display:inline-flex;align-items:center;gap:5px;max-width:100%;border:1px solid var(--edge);background:transparent;border-radius:999px;padding:1px 9px 1px 7px;font-size:12px;font-weight:500;line-height:1.5;color:var(--ink2);white-space:nowrap}
.wtag svg{width:13px;height:13px;flex:none}
.wtag:hover{background:var(--hover)}
.wtag.own{border-color:var(--ink);color:var(--ink)}
.wtag.none{border-style:dashed;color:var(--ink3)}
@media (hover:hover){.col .wtag.none{opacity:0}.col:hover .wtag.none,.col .wtag.none:focus-visible{opacity:1}}
.w-short{display:none}
#pat{width:min(640px,calc(100vw - 32px))}
.pat{display:flex;flex-direction:column;gap:10px}
.prow{display:grid;grid-template-columns:104px 1fr;gap:8px;align-items:center}
.prow>b{font-weight:500}
.prow .seg{display:flex}.prow .seg button{flex:1;padding:5px 8px;font-size:14px;white-space:nowrap}
.note0.pn{margin:-6px 0 0}
.add{border:0;background:transparent;border-radius:8px;width:28px;height:28px;font-size:18px;color:var(--ink2)}
.add:hover{background:var(--hover)}
.fill{height:12px;border-radius:6px;background:var(--border);overflow:hidden;display:flex}
.fill i{display:block;height:100%;background:var(--aztext)}
.fill.hi i{background:var(--ink)}
.fill i.ov,.fill.hi i.ov,.fb i.ov,.fb.hi i.ov,.mb i.ov,.mb.hi i.ov{background:repeating-linear-gradient(135deg,var(--ink) 0 2px,var(--card) 2px 5px);box-shadow:inset 0 0 0 1px var(--ink)}
.stat{font-size:13px;color:var(--ink);min-height:19px}
.stat b{font-weight:600}
.stat svg{width:12px;height:12px;vertical-align:-1px;margin-right:3px}
.card{position:relative;background:var(--wk-wash);color:var(--wk-title);border:1px solid var(--wk-line);border-radius:10px;padding:8px 34px 8px 10px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;cursor:grab;min-height:56px}
.card.life{background:var(--lf-wash);color:var(--lf-title);border-color:var(--lf-line)}
.card.meeting{background:var(--card);color:var(--ink);border:1px dashed var(--bstrong);cursor:default}
.card.s-half{min-height:96px}.card.s-full{min-height:140px}
.card.done .ct{text-decoration:line-through;color:var(--ink3)}
.card.dragging{opacity:.4}
.ct{font-size:15px;font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.cm{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:0 8px;background:var(--wk-chip);color:var(--wk-on)}
.tag svg{width:12px;height:12px;flex:none}
.tag.life{background:var(--lf-chip);color:var(--lf-on)}
.tag.meet{background:transparent;color:var(--ink2);border:1px solid var(--edge)}
.card .sz{color:inherit}
.card.meeting .sz{color:var(--ink2)}
.tag{flex:none;white-space:nowrap}
.catw{display:inline-flex;align-items:center;gap:2px}
.catx{border:0;background:transparent;border-radius:50%;width:22px;height:22px;font-size:11px;color:var(--ink3)}.catx:hover{background:var(--hover)}
#fCatIn{width:150px;padding:5px 10px}
.sz{font-size:12px;color:var(--ink2)}
.due{white-space:nowrap;font-size:12px;font-weight:600;background:var(--ink);color:var(--onink);border-radius:999px;padding:0 8px}
.more{position:absolute;top:4px;right:4px;width:28px;height:28px;border:0;border-radius:8px;background:transparent;font-size:18px;line-height:1;color:var(--ink2)}
.more:hover{background:var(--hover)}
.menu{position:fixed;z-index:20;background:var(--card);border:1px solid var(--bstrong);border-radius:12px;padding:6px;min-width:190px;box-shadow:0 12px 32px rgba(41,41,41,.16)}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:6px 10px}
.menu button:hover,.menu button:focus-visible{background:var(--hover)}
.menu button:focus-visible{outline-offset:-2px;box-shadow:none}
.menu hr{border:0;border-top:1px solid var(--border);margin:4px 0}
.menu small{display:block;padding:4px 10px;color:var(--ink3);font-size:12px}
.undo{position:fixed;z-index:30;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;max-width:min(560px,calc(100vw - 32px));background:var(--ink);color:var(--onink);border-radius:999px;padding:6px 8px 6px 18px;box-shadow:0 12px 32px rgba(41,41,41,.16)}
.undo span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.undo button{flex:none;border:0;border-radius:999px;background:var(--az);color:#292929;font-weight:600;padding:6px 16px}
.undo button:hover{background:var(--azhover)}
.menu button svg{width:14px;height:14px;vertical-align:-2px;margin-right:6px}
#bDel{margin-right:auto}
.glance{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--azsoft);border-radius:14px;padding:12px 16px;margin-bottom:14px}
.glance h2{font-size:14px;font-weight:600;color:var(--aztext);margin-right:6px}
.glance .pill{background:var(--card);color:var(--ink)}
.pulse{animation:pulse 1.5s ease-out}
@keyframes pulse{0%{box-shadow:0 0 0 4px var(--ink)}100%{box-shadow:0 0 0 4px transparent}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;outline:3px solid var(--ink)}}
.lk{font:500 12px/1.5 Inter,system-ui,sans-serif;color:var(--aztext);background:var(--azsoft);border:0;border-radius:999px;padding:0 8px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
button.lk{cursor:pointer}button.lk:hover{text-decoration:underline}
.lk.led{background:var(--sunken);color:var(--ink2)}
#fFollow{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--border);padding-top:12px}
#fFromLine{font-size:14px;color:var(--ink2)}
.fu{display:flex;gap:8px;align-items:center;font-size:14px}.fu span{flex:1}.fu small{color:var(--ink3)}
.note0{font-size:14px;color:var(--ink3)}
#fFromNote{margin:0;font-size:14px;color:var(--aztext);background:var(--azsoft);border-radius:10px;padding:6px 12px}
#wk h2{font:900 26px/1.2 Kondolar,Georgia,serif}
#wk p{margin:0;color:var(--ink2)}
/* month */
.mgrid{display:grid;grid-template-columns:84px repeat(7,minmax(0,1fr));gap:6px;align-items:stretch}
.mh{font-size:13px;font-weight:500;color:var(--ink2);text-align:center;padding:4px 0}
.mw{border:0;background:none;text-align:left;font-weight:600;color:var(--ink2);padding:8px 8px;border-radius:10px}
.mw:hover{background:var(--hover)}
.mc{border:1px solid var(--border);background:var(--card);border-radius:10px;min-height:78px;padding:6px 8px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.mc:hover{border-color:var(--ink)}
.mc.wk{background:var(--sunken)}.mc.today{border:2px solid var(--ink);padding:5px 7px}
.mc .n{font-size:13px;color:var(--ink2)}
.dots{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--rest)}
.dots i.t{background:var(--wk-chip)}.dots i.l{background:transparent;border:2px solid var(--lf-chip)}
.dots i.d{background:var(--ink);border-radius:3px}
.dots span{font-size:12px;color:var(--ink2)}
.mw.heavy{background:var(--azsoft);color:var(--aztext)}
.mc.hv{background:var(--azsoft);border-color:var(--azsoft)}.mc.hv.wk{background:var(--azsoft)}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:14px;color:var(--ink2);font-size:14px;align-items:center}
.legend span{display:inline-flex;gap:8px;align-items:center}
.legend i{width:12px;height:12px;border-radius:50%;background:var(--rest);display:inline-block}
.legend i.t{background:var(--wk-chip)}.legend i.l{background:transparent;border:2px solid var(--lf-chip)}.legend i.d{background:var(--ink);border-radius:3px}
/* dialog */
dialog{border:1px solid var(--bstrong);border-radius:20px;padding:0;background:var(--card);color:var(--ink);width:min(520px,calc(100vw - 32px));box-shadow:0 12px 32px rgba(41,41,41,.16)}
dialog::backdrop{background:rgba(27,27,25,.35)}
form{display:flex;flex-direction:column;gap:14px;padding:24px}
form h2{font:900 26px/1.2 Kondolar,Georgia,serif}
#fKind button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
#fKind svg{width:14px;height:14px}
#fKind [data-kind=work][aria-checked=true]{background:var(--wk-chip);color:var(--wk-on);box-shadow:none}
#fKind [data-kind=life][aria-checked=true]{background:var(--lf-chip);color:var(--lf-on);box-shadow:none}
label.l{font-size:13px;font-weight:500;color:var(--ink2);display:block;margin-bottom:4px}
input[type=text],input[type=date],select{width:100%;border:1px solid var(--edge);background:var(--bg);border-radius:10px;padding:9px 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:flex-end;margin-top:4px}
.seg.full{display:flex}.seg.full button{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.nav{margin-left:0}}
@media (max-width:420px){.brand{font-size:30px}}
/* ---------- phone and tablet (WA-22): under 1024 wide; the layout above 1024 is untouched ---------- */
#app-m,#sheet{display:none}
.chk{display:none}
.pickers{display:contents}
#fSum,#fDayChips{display:none}
html[data-theme=light]{color-scheme:light}html[data-theme=dark]{color-scheme:dark}
@media (max-width:1023px){
  html{-webkit-text-size-adjust:100%}
  button,.card{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .bar,main{display:none}
  .banner{margin:8px max(12px,env(safe-area-inset-left));font-size:14px}
  .banner button{min-height:44px;padding:0 6px}
  #app-m{display:block;--tab:58px;--lb:0px;--pad:12px;padding-bottom:calc(var(--tab) + var(--lb) + 100px + env(safe-area-inset-bottom))}
  #app-m.hasloose{--lb:48px}
  .mhead{position:sticky;top:0;z-index:5;background:var(--sunken);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;min-height:56px;padding:calc(6px + env(safe-area-inset-top)) max(var(--pad),env(safe-area-inset-right)) 6px max(var(--pad),env(safe-area-inset-left))}
  .ar{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--edge);background:var(--card);font-size:24px;line-height:1;display:grid;place-items:center;padding:0 0 3px}
  .mt{flex:1;min-width:0;text-align:center;line-height:1.2}
  .mt b{display:block;font:900 20px/1.2 Kondolar,Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mt span{font-size:14px;color:var(--ink2)}
  .tdp{flex:none;min-height:44px;border:1px solid var(--ink);border-radius:999px;background:var(--card);padding:0 14px;font-size:14px;font-weight:600}
  .mbody{padding:0 max(var(--pad),env(safe-area-inset-right)) 0 max(var(--pad),env(safe-area-inset-left))}
  .strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;padding:10px 0 6px;margin:0 -4px}
  .sd{position:relative;min-height:72px;border:1.5px solid transparent;border-radius:14px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 0}
  .sd.wk{background:var(--sunken)}
  .sd[aria-pressed=true]{background:var(--card);border-color:var(--ink)}
  .dn{font-size:14px;color:var(--ink2);line-height:1.3}
  .dd{font-size:17px;font-weight:600;line-height:1.3}
  .td{width:5px;height:5px;border-radius:50%;background:var(--ink)}.td.off{visibility:hidden}
  .mb{width:26px;height:5px;border-radius:3px;background:var(--border);overflow:hidden;margin-top:2px;display:flex}
  .mb i{display:block;height:100%;background:var(--aztext)}.mb.hi i{background:var(--ink)}
  .dl{position:absolute;top:2px;right:2px;width:8px;height:8px;background:var(--ink);border-radius:2px}
  .dlist{padding:8px 0 0;display:flex;flex-direction:column;gap:8px}
  .dh{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
  .dh .wtag{flex:none;min-height:36px;padding:0 12px 0 10px;font-size:14px}.dh .wtag svg{width:16px;height:16px}
  .strip.hw .sd{min-height:84px;padding-top:16px}
  .sw{position:absolute;top:5px;left:50%;margin-left:-7px;width:14px;height:14px;color:var(--ink2)}.sw svg{width:14px;height:14px;display:block}
  .w-long{display:none}.w-short{display:inline}
  .prow{grid-template-columns:minmax(0,1fr);gap:4px}.prow .seg button{min-height:44px;padding:0 4px}
  .dh h2{font:900 21px/1.3 Kondolar,Georgia,serif;flex:1 1 auto}
  .dh h3{font:900 18px/1.3 Kondolar,Georgia,serif;flex:1 1 auto}
  .fbw{display:flex;align-items:center;gap:10px;flex:1 0 100%}
  .fb{flex:1;height:10px;border-radius:5px;background:var(--border);overflow:hidden;display:flex}
  .fb i{display:block;height:100%;background:var(--aztext)}.fb.hi i{background:var(--ink)}
  .fw{font-size:14px;color:var(--ink);min-width:96px;text-align:right}.fw svg{width:14px;height:14px;vertical-align:-2px;margin-right:3px}
  .mempty{font-size:15px;color:var(--ink2);padding:10px 2px}
  .card{cursor:default;min-height:60px;border-radius:14px;padding:10px 52px 10px 14px;gap:6px}
  .card.hc{padding-left:56px}
  .card.s-half,.card.s-full{min-height:60px}
  .ct{font-size:15px;line-height:1.4}
  .tag{font-size:14px;letter-spacing:.02em;padding:1px 10px}.tag svg{width:14px;height:14px}
  .sz,.due,.lk{font-size:14px}

}
/* swipe the day list sideways for the next or previous day (not from the screen edge) */
(function () {
  let x0 = 0, y0 = 0, on = false;
  const body = $('mbody');
  body.addEventListener('touchstart', e => { const t = e.touches[0]; on = e.touches.length === 1 && ui.view === 'week' && t.clientX > 20 && t.clientX < innerWidth - 20; x0 = t.clientX; y0 = t.clientY; }, { passive:true });
  body.addEventListener('touchend', e => {
    if (!on) return; on = false; const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    if (Math.abs(dx) > 56 && Math.abs(dy) < Math.abs(dx) * .6) go(dx < 0 ? 1 : -1);
  }, { passive:true });
})();

/* ---------- start ---------- */
document.querySelectorAll('.ic-wk').forEach(e => e.innerHTML = IC.work); document.querySelectorAll('.ic-lf').forEach(e => e.innerHTML = IC.life);
(async function init() {
  if (CLOUD) {
    try { const c = JSON.parse(localStorage.getItem('wa-cloud-cache') || 'null'); if (c && c.S && Array.isArray(c.S.tasks)) { S = c.S; cloud.dirty = !!c.dirty; } } catch (e) {}
    snapBase();
  } else {
    try {
      try { const st = await (await fetch('/api/sync')).json(); if (st && st.enabled) { syncOn = true; localSync = st; rev = st.rev; } } catch (e) {}
      const r = await fetch('/api/state'); const j = await r.json(); if (j && Array.isArray(j.tasks)) S = j; else { S = seed(); save(); }
    }
    catch (e) { S = seed(); setSaved('Not saved'); }
    if (syncOn) { snapBase(); setInterval(pollLocal, 30000); document.addEventListener('visibilitychange', () => { if (!document.hidden) pollLocal(); }); }
  }
  if (new Date().getDay() === 0) {
    ui.anchor = add(THIS_MON, 7);
    setNotice('It’s Sunday, so this opened on next week. <button type="button" data-act="backthis">Back to this week</button> <button type="button" data-act="dismiss" aria-label="Dismiss">Dismiss</button>');
  }
  applyTheme(); render();
  if (CLOUD) { if (cloudCfg()) { cloud.started = true; cloudStart(); } else showSetup(); }
})();
</script>
